name: fuxi loader
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the reference loader
        uses: actions/checkout@v4
        with:
          repository: bangprovn/ios-fuxi
          path: src
      - name: Fetch our inputs
        uses: actions/checkout@v4
        with:
          path: ours
      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm
      - name: Relax the pinned firmware checks
        run: |
          cd src/shim/fuxi-loader
          sed -i 's/if reserved:/if False:/' build.sh
          sed -i 's/assert match and int(match\[1\], 16) == 0x25ac8/assert match/' build.sh
          sed -i 's|^python3 "$MKBOOTIMG"|exit 0\npython3 "$MKBOOTIMG"|' build.sh
          sed -i 's/-Werror/-Wno-error -Wno-array-bounds -Wno-stringop-overflow/' build.sh
          grep -n "Wno-error" build.sh | head -2
          grep -n "if False" build.sh | head -3
          grep -n "assert match" build.sh | head -3

      - name: Build the boot image
        env:
          CLANG: clang
          LLD: ld.lld
          OBJCOPY: llvm-objcopy
          READELF: llvm-readelf
          MKBOOTIMG: /bin/sh
          FUXI_GMU_FIRMWARE: ${{ github.workspace }}/ours/fuxi-loader-build/gmu_gen70200.bin
          FUXI_SQE_FIRMWARE: ${{ github.workspace }}/ours/fuxi-loader-build/a740_sqe.fw
          FUXI_GPU_ZAP_MBN: ${{ github.workspace }}/ours/fuxi-loader-build/a740_zap.mbn
        run: |
          bash src/shim/fuxi-loader/build.sh "${{ github.workspace }}/ours/fuxi-loader-build/payload"
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fuxi-xnu-boot
          path: src/shim/out/fuxi-loader/Image
